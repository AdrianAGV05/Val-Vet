<div class="main-container">
<div class="form-container">
  <h1>Registro de Mascotas</h1>
  <form>

    <div class="form-group">
      <label>Nombre de la mascota:</label>
      <input type="text" [(ngModel)]="mascota.nombre" name="nombre" placeholder="" required #nombre="ngModel">
    </div>

    <div class="form-group">
      <label>Especie:</label>
      <select [(ngModel)]="mascota.especie" name="especie" required>
        <option value="" disabled selected>Seleccione una especie</option>
        <option value="Perro">Perro</option>
        <option value="Gato">Gato</option>
      </select>
    </div>

    <div class="form-group">
      <label>Raza:</label>
      <input type="text" [(ngModel)]="mascota.raza" name="raza" placeholder="">
    </div>

    <div class="form-group">
      <label>Fecha de nacimiento:</label>
      <input type="date" [(ngModel)]="mascota.fechaNacimiento" name="fechaNacimiento">
    </div>

    <div class="form-group">
      <label>Sexo:</label>
      <select [(ngModel)]="mascota.sexo" name="sexo">
        <option value="" disabled selected>Seleccione sexo</option>
        <option value="Macho">Macho</option>
        <option value="Hembra">Hembra</option>
      </select>
    </div>

    <div class="form-group">
      <label>Microchip:</label>
      <input type="text" [(ngModel)]="mascota.microchip" name="microchip" placeholder="Ej. 123456789">
    </div>

    <div class="form-group">
      <label>Tamaño:</label>
      <select [(ngModel)]="mascota.tamano" name="tamano">
        <option value="" disabled selected>Seleccione tamaño</option>
        <option value="Chico">Chico</option>
        <option value="Mediano">Mediano</option>
        <option value="Grande">Grande</option>
        <option value="Jumbo">Jumbo</option>
      </select>
    </div>

    <div class="form-group">
      <label>Color:</label>
      <input type="text" [(ngModel)]="mascota.color" name="color" placeholder="Ej. Blanco con manchas negras">
    </div>

    <div class="form-group">
      <label>Tatuaje:</label>
      <select [(ngModel)]="mascota.tatuaje" name="tatuaje">
        <option value="" disabled selected>Seleccione oopcion</option>
        <option value=true>Si</option>
        <option value=false>No</option>
      </select>
    </div>
    <button type="submit" class="btn-registrar" (click)="guardarDatos()">{{botonAccion}}</button>
  </form>
</div>
 <!-- TABLA -->
<div>
  <div class="tabla-container">
    <h2>Listado de Mascotas</h2>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Especie</th>
          <th>Raza</th>
          <th>Sexo</th>
          <th>Color</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of mascotas; let i = index">
          <td>{{ m.nombre }}</td>
          <td>{{ m.especie }}</td>
          <td>{{ m.raza }}</td>
          <td>{{ m.sexo }}</td>
          <td>{{ m.color }}</td>
          <td class="acciones">
            <button class="btn-editar" (click)="editarMascota(i)">Editar</button>
            <button class="btn-eliminar" (click)="eliminarMascota(i)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</div>
