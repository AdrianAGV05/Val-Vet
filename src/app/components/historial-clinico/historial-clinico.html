    <!-- Sidebar -->
    <aside class="sidebar">

        <nav class="sidebar-nav">

                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">

                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19,20H5V18H19V20M19,10H5V8H19V10M19,15H5V13H19V15M19,5H5V3H19V5Z" />

                Categorias

            <div class="nav-item" routerLink="/proveedores">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">

                Proveedores

    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Top Header -->
        <header class="top-header">
            <div class="breadcrumb">Clientes / Historial Médico</div>
            <div class="header-actions">
                <button class="btn-primary" style="padding: 8px 16px;">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                        <path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" />
                    </svg>
                    Guardar e Imprimir
                </button>
                <div class="user-profile">
                    <div class="avatar">AS</div>
                    <div class="user-info">
                        <span class="user-name">Administrador</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="historial-container">
                <div class="historial-header">
                    <div class="header-row">
                        <div class="form-field inline-field">
                            <label>FECHA:</label>
                            <input type="date" class="border-bottom-input">
                        </div>
                        <div class="form-field inline-field">
                            <label>NRO DE HISTORIA:</label>
                            <input type="text" class="border-bottom-input" placeholder="0001">
                        </div>
                    </div>
                    <h1 class="historia-title">HISTORIA CLÍNICA</h1>
                </div>

                <!-- 1. DATOS DEL PROPIETARIO -->
                <div class="historial-section">
                    <h2 class="section-heading">1. DATOS DEL PROPIETARIO</h2>
                    <div class="form-grid">
                        <div class="form-field full-width">
                            <label>Nombre y Apellido:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field full-width">
                            <label>Dirección:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field full-width">
                            <label>Teléfono /Celular:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field full-width">
                            <label>Correo electrónico:</label>
                            <input type="email" class="table-input">
                        </div>
                    </div>
                </div>

                <!-- 2. DATOS DEL PACIENTE -->
                <div class="historial-section">
                    <h2 class="section-heading">2. DATOS DEL PACIENTE</h2>
                    <div class="form-grid two-cols">
                        <div class="form-field">
                            <label>Especie:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Raza:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Nombre:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Edad:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Sexo:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Peso:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Alimento:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field empty-cell">
                            <!-- Empty cell for alignment, mirroring the image -->
                        </div>
                    </div>
                </div>

                <!-- 3. MOTIVO DE LA CONSULTA -->
                <div class="historial-section">
                    <h2 class="section-heading">3. MOTIVO DE LA CONSULTA</h2>
                    <div class="form-field full-width">
                        <textarea class="diagnosis-textarea" rows="6"></textarea>
                    </div>
                </div>

                <!-- 4. EVALUACIÓN CLÍNICA/ CONSTANTES -->
                <div class="historial-section">
                    <h2 class="section-heading">4. EVALUACIÓN CLÍNICA/ CONSTANTES</h2>
                    <div class="form-grid two-cols">
                        <div class="form-field">
                            <label>Temperatura:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Color de Mucosas:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Frecuencia respiratoria:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Ganglios:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Frecuencia cardiaca:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>TLLC:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Pulso:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field inline-label-input">
                            <label>Condición corporal:</label>
                            <input type="text" class="table-input short-input">
                            <span>/5</span>
                        </div>
                        <div class="form-field">
                            <label>Vulva/ pene:</label>
                            <input type="text" class="table-input">
                        </div>
                        <div class="form-field">
                            <label>Oídos:</label>
                            <input type="text" class="table-input">
                        </div>
                    </div>
                </div>

                <!-- 5. SIGNOS CLINICOS -->
                <div class="historial-section">
                    <h2 class="section-heading">5. SIGNOS CLINICOS</h2>
                    <div class="form-field full-width">
                        <textarea class="diagnosis-textarea" rows="6"></textarea>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>
