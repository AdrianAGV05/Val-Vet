<header class="header">
  <a routerLink="/pagina-principal" class="home-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
    </svg>
  </a>
  <div class="header-content">
    <h1 class="title">Pet Vet</h1>
    <h2 class="subtitle">Servicio Veterinario</h2>
  </div>
</header>
<app-main-header></app-main-header>

<div class="content">
  <div class="login-container">
    <h2>Iniciar Sesión</h2>

    <form class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="codigo">Código de Confirmación</label>
        <input type="text" id="codigo" placeholder="Ingrese su código" required>
      </div>

      <button type="submit" class="btn-aceptar">Aceptar</button>

      <div class="nuevo-usuario">
        <a routerLink="/registro-usuario">Nuevo usuario</a>
      </div>
    </form>
  </div>
</div>
<app-pie-de-pagina></app-pie-de-pagina>
